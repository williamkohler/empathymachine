<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Services · Empathy Machine</title>
  <meta name="description" content="Empathy Machine. Services.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23ECEFF7'/%3E%3Ccircle cx='12' cy='16' r='9' fill='%23FF6B8A'/%3E%3Ccircle cx='20' cy='16' r='9' fill='%233D5AF1' style='mix-blend-mode:multiply'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --neon: #39FF14;
      --halo: 0 0 2px rgba(10, 20, 10, 0.9), 0 0 4px rgba(10, 20, 10, 0.5);
      --glow: var(--halo), 0 0 8px rgba(57, 255, 20, 0.85), 0 0 24px rgba(57, 255, 20, 0.5);
      --sign: 0 0 2px var(--neon), 0 0 7px var(--neon), 0 0 16px var(--neon),
              0 0 32px rgba(57, 255, 20, 0.75), 0 0 64px rgba(57, 255, 20, 0.45), 0 0 110px rgba(57, 255, 20, 0.25),
              var(--halo);
    }

    * { box-sizing: border-box; margin: 0; }

    html, body { min-height: 100%; }

    body {
      background: #D9D3E3;
      color: var(--neon);
      font-family: "JetBrains Mono", ui-monospace, Menlo, monospace;
      text-transform: uppercase;
    }

    .photo {
      position: fixed;
      inset: 0;
      z-index: -1;
      background: #C3CBE6 center / cover no-repeat;
    }

    .photo.a { background-image: url(bg-a-1600.jpg); }
    .photo.b { background-image: url(bg-b-1600.jpg); background-color: #E6A9B6; }

    @media (max-width: 700px) {
      .photo.a { background-image: url(bg-a-900.jpg); }
      .photo.b { background-image: url(bg-b-900.jpg); }
    }

    main {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: clamp(24px, 5vw, 72px);
    }

    .home {
      position: fixed;
      top: clamp(24px, 5vw, 72px);
      left: clamp(24px, 5vw, 72px);
      font-size: clamp(1rem, 1.4vw, 1.3rem);
      text-decoration: none;
    }

    h1 {
      font-size: clamp(3.25rem, 12.5vw, 12rem);
      font-weight: 400;
      line-height: 1.02;
      letter-spacing: 0.03em;
      color: #b6ff9c;
      text-shadow: var(--sign);
    }

    p, ul {
      margin-top: clamp(20px, 3vw, 40px);
      max-width: 34ch;
      font-size: clamp(1.1rem, 1.6vw, 1.5rem);
      line-height: 1.55;
      letter-spacing: 0.02em;
      text-shadow: var(--glow);
    }

    ul { list-style: none; padding: 0; }

    nav {
      margin-top: clamp(20px, 3vw, 40px);
      display: flex;
      flex-wrap: wrap;
      gap: 0 0.7em;
      font-size: clamp(1.1rem, 1.6vw, 1.5rem);
      line-height: 1.55;
      letter-spacing: 0.02em;
    }

    nav a { text-decoration: none; }

    nav a + a::before, nav span + a::before, nav a + span::before {
      content: "|";
      margin-right: 0.7em;
      font-weight: 400;
      color: var(--neon);
      text-shadow: var(--glow);
    }

    nav span { font-weight: 800; color: #fff; text-shadow: var(--glow); }

    a {
      color: var(--neon);
      font-weight: 800;
      text-shadow: var(--glow);
      text-decoration-thickness: 0.08em;
      text-underline-offset: 0.18em;
    }

    a:hover { color: #fff; }

    a:focus-visible {
      outline: 2px solid var(--neon);
      outline-offset: 4px;
      border-radius: 2px;
    }
  </style>
</head>
<body>
  <div class="photo a" aria-hidden="true"></div>

  <a class="home" href="./">Empathy Machine</a>

  <main>
    <h1>Services</h1>
    <ul>
      <li>Choreography</li>
      <li>Movement direction</li>
      <li>Workshops and classes</li>
    </ul>
    <nav aria-label="Site">
      <a href="mailto:contact@empathymachine.online">Contact</a>
      <a href="portfolio.html">Portfolio</a>
      <span aria-current="page">Services</span>
    </nav>
  </main>

  <script>
    // Flip a coin for which paint photo hangs behind the page this visit.
    document.querySelector('.photo').className = 'photo ' + (Math.random() < 0.5 ? 'a' : 'b');
  </script>
</body>
</html>
