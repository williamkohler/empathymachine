<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Empathy Machine</title>
  <meta name="description" content="Empathy Machine. Contact: contact@empathymachine.online">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23ECEFF7'/%3E%3Ccircle cx='12' cy='16' r='9' fill='%23FF6B8A'/%3E%3Ccircle cx='20' cy='16' r='9' fill='%233D5AF1' style='mix-blend-mode:multiply'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #ECEFF7;
      --ink: #1B1F3B;
      --ink-soft: #4A4F73;
      --rose: #FF6B8A;
      --cobalt: #3D5AF1;
      --circle: clamp(180px, 34vmin, 420px);
    }

    * { box-sizing: border-box; margin: 0; }

    html, body { height: 100%; }

    body {
      background: var(--paper);
      color: var(--ink);
      font-family: "JetBrains Mono", ui-monospace, Menlo, monospace;
      text-transform: uppercase;
      overflow: hidden;
    }

    .field {
      position: fixed;
      inset: 0;
      isolation: isolate;
    }

    .circle {
      position: absolute;
      top: 0;
      left: 0;
      width: var(--circle);
      height: var(--circle);
      margin: calc(var(--circle) / -2) 0 0 calc(var(--circle) / -2);
      border-radius: 50%;
      mix-blend-mode: multiply;
      will-change: transform;
    }

    .circle.you { background: var(--rose); }
    .circle.other { background: var(--cobalt); }

    main {
      position: relative;
      min-height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: clamp(24px, 5vw, 72px);
      pointer-events: none;
    }

    h1 {
      font-size: clamp(3.25rem, 12.5vw, 12rem);
      font-weight: 800;
      line-height: 0.95;
      letter-spacing: -0.04em;
      mix-blend-mode: multiply;
    }

    p {
      margin-top: clamp(20px, 3vw, 40px);
      max-width: 34ch;
      font-size: clamp(0.95rem, 1.25vw, 1.15rem);
      font-weight: 400;
      line-height: 1.55;
      letter-spacing: 0.02em;
      color: var(--ink-soft);
    }

    a {
      color: var(--ink);
      font-weight: 600;
      text-decoration-thickness: 0.08em;
      text-underline-offset: 0.18em;
      pointer-events: auto;
    }

    a:hover { color: var(--cobalt); }

    a:focus-visible {
      outline: 2px solid var(--cobalt);
      outline-offset: 4px;
      border-radius: 2px;
    }
  </style>
</head>
<body>
  <div class="field" aria-hidden="true">
    <div class="circle other"></div>
    <div class="circle you"></div>
  </div>

  <main>
    <h1>Empathy<br>Machine</h1>
    <p><a href="mailto:contact@empathymachine.online">contact@empathymachine.online</a></p>
  </main>

  <script>
    (function () {
      var you = document.querySelector('.circle.you');
      var other = document.querySelector('.circle.other');
      var w = window.innerWidth, h = window.innerHeight;
      var target = { x: w * 0.62, y: h * 0.38 };
      var a = { x: target.x, y: target.y };
      var b = { x: w * 0.3, y: h * 0.3 };
      var still = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      function place(el, p) {
        el.style.transform = 'translate3d(' + p.x + 'px,' + p.y + 'px,0)';
      }

      function point(e) {
        target.x = e.clientX;
        target.y = e.clientY;
      }

      window.addEventListener('pointermove', point, { passive: true });
      window.addEventListener('pointerdown', point, { passive: true });
      window.addEventListener('resize', function () {
        w = window.innerWidth;
        h = window.innerHeight;
      });

      if (still) {
        // Half-overlapped and at rest: the meeting has already happened.
        var r = you.offsetWidth / 4;
        place(you, { x: target.x + r, y: target.y });
        place(other, { x: target.x - r, y: target.y });
        return;
      }

      function tick() {
        a.x += (target.x - a.x) * 0.18;
        a.y += (target.y - a.y) * 0.18;
        // The other circle approaches slowly and stops short of full overlap.
        var dx = a.x - b.x, dy = a.y - b.y;
        var dist = Math.sqrt(dx * dx + dy * dy) || 1;
        var rest = you.offsetWidth * 0.45;
        var pull = (dist - rest) / dist;
        b.x += dx * pull * 0.025;
        b.y += dy * pull * 0.025;
        place(you, a);
        place(other, b);
        requestAnimationFrame(tick);
      }
      tick();
    })();
  </script>
</body>
</html>
