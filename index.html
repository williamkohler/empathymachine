<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Empathy Machine</title>
  <meta name="description" content="Empathy Machine. Contact: contact@empathymachine.online">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23ECEFF7'/%3E%3Ccircle cx='12' cy='16' r='9' fill='%23FF6B8A'/%3E%3Ccircle cx='20' cy='16' r='9' fill='%233D5AF1' style='mix-blend-mode:multiply'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --neon: #39FF14;
      --halo: 0 0 2px rgba(10, 20, 10, 0.9), 0 0 4px rgba(10, 20, 10, 0.5);
      --glow: var(--halo), 0 0 8px rgba(57, 255, 20, 0.85), 0 0 24px rgba(57, 255, 20, 0.5);
      --r: clamp(130px, 24vmin, 320px);
      --ax: 62vw; --ay: 38vh; --arx: var(--r); --ary: var(--r); --asoft: 55%;
      --bx: 30vw; --by: 30vh; --brx: var(--r); --bry: var(--r);
      --t1x: -1px; --t1y: -1px; --t1r: 0px;
      --t2x: -1px; --t2y: -1px; --t2r: 0px;
      --t3x: -1px; --t3y: -1px; --t3r: 0px;
      --t4x: -1px; --t4y: -1px; --t4r: 0px;
    }

    * { box-sizing: border-box; margin: 0; }

    html, body { height: 100%; }

    body {
      background: #D9D3E3;
      color: var(--neon);
      font-family: "JetBrains Mono", ui-monospace, Menlo, monospace;
      text-transform: uppercase;
      overflow: hidden;
    }

    .field {
      position: fixed;
      inset: 0;
      overflow: hidden;
    }

    .layer {
      position: absolute;
      inset: 0;
      background: url(bg-1600.jpg) center / cover no-repeat;
    }

    @media (max-width: 700px) {
      .layer { background-image: url(bg-900.jpg); }
    }

    /* Lenses cut through the paint to the video underneath: the pointer lens, its follower,
       and four small comet-tail lenses that only appear at speed. The gradients union by default. */
    .layer.reel {
      background: #000;
      object-fit: cover;
      width: 100%;
      height: 100%;
      -webkit-mask-image:
        radial-gradient(ellipse var(--arx) var(--ary) at var(--ax) var(--ay), #000 var(--asoft), rgba(0,0,0,0.8) calc(var(--asoft) + (100% - var(--asoft)) * 0.33), rgba(0,0,0,0.4) calc(var(--asoft) + (100% - var(--asoft)) * 0.66), rgba(0,0,0,0.1) calc(var(--asoft) + (100% - var(--asoft)) * 0.88), transparent 100%),
        radial-gradient(ellipse var(--brx) var(--bry) at var(--bx) var(--by), #000 55%, rgba(0,0,0,0.8) 70%, rgba(0,0,0,0.4) 85%, rgba(0,0,0,0.1) 95%, transparent 100%),
        radial-gradient(circle var(--t1r) at var(--t1x) var(--t1y), #000 40%, rgba(0,0,0,0.5) 70%, transparent 100%),
        radial-gradient(circle var(--t2r) at var(--t2x) var(--t2y), #000 40%, rgba(0,0,0,0.5) 70%, transparent 100%),
        radial-gradient(circle var(--t3r) at var(--t3x) var(--t3y), #000 40%, rgba(0,0,0,0.5) 70%, transparent 100%),
        radial-gradient(circle var(--t4r) at var(--t4x) var(--t4y), #000 40%, rgba(0,0,0,0.5) 70%, transparent 100%);
      mask-image:
        radial-gradient(ellipse var(--arx) var(--ary) at var(--ax) var(--ay), #000 var(--asoft), rgba(0,0,0,0.8) calc(var(--asoft) + (100% - var(--asoft)) * 0.33), rgba(0,0,0,0.4) calc(var(--asoft) + (100% - var(--asoft)) * 0.66), rgba(0,0,0,0.1) calc(var(--asoft) + (100% - var(--asoft)) * 0.88), transparent 100%),
        radial-gradient(ellipse var(--brx) var(--bry) at var(--bx) var(--by), #000 55%, rgba(0,0,0,0.8) 70%, rgba(0,0,0,0.4) 85%, rgba(0,0,0,0.1) 95%, transparent 100%),
        radial-gradient(circle var(--t1r) at var(--t1x) var(--t1y), #000 40%, rgba(0,0,0,0.5) 70%, transparent 100%),
        radial-gradient(circle var(--t2r) at var(--t2x) var(--t2y), #000 40%, rgba(0,0,0,0.5) 70%, transparent 100%),
        radial-gradient(circle var(--t3r) at var(--t3x) var(--t3y), #000 40%, rgba(0,0,0,0.5) 70%, transparent 100%),
        radial-gradient(circle var(--t4r) at var(--t4x) var(--t4y), #000 40%, rgba(0,0,0,0.5) 70%, transparent 100%);
    }

    main {
      position: relative;
      min-height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: clamp(24px, 5vw, 72px);
      pointer-events: none;
    }

    h1 {
      font-size: clamp(3.25rem, 12.5vw, 12rem);
      font-weight: 800;
      line-height: 0.95;
      letter-spacing: -0.04em;
      text-shadow: var(--glow);
    }

    p {
      margin-top: clamp(20px, 3vw, 40px);
      max-width: 34ch;
      font-size: clamp(1.1rem, 1.6vw, 1.5rem);
      font-weight: 400;
      line-height: 1.55;
      letter-spacing: 0.02em;
    }

    a {
      color: var(--neon);
      font-weight: 800;
      text-shadow: var(--glow);
      text-decoration-thickness: 0.08em;
      text-underline-offset: 0.18em;
      pointer-events: auto;
    }

    a:hover { color: #fff; }

    a:focus-visible {
      outline: 2px solid var(--neon);
      outline-offset: 4px;
      border-radius: 2px;
    }


    .layer.reel.next { display: none; }

    @media (prefers-reduced-motion: reduce) {
      .layer.reel { display: none; }
    }
  </style>
</head>
<body>
  <div class="field" aria-hidden="true">
    <div class="layer photo"></div>
    <video class="layer reel" muted playsinline preload="auto"></video>
    <video class="layer reel next" muted playsinline preload="auto"></video>
  </div>

  <main>
    <h1>Empathy<br>Machine</h1>
    <p><a href="mailto:contact@empathymachine.online">contact@empathymachine.online</a></p>
  </main>


  <script>
    (function () {
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

      var root = document.documentElement.style;

      // Dance clips play underneath the paint in a fresh shuffled order on every visit.
      (function reel() {
        var reels = document.querySelectorAll('.layer.reel');
        var current = reels[0], next = reels[1];
        var queue = [], list = [];

        function shuffled() {
          var a = list.slice();
          for (var i = a.length - 1; i > 0; i--) {
            var j = Math.floor(Math.random() * (i + 1));
            var t = a[i]; a[i] = a[j]; a[j] = t;
          }
          return a;
        }

        function pick() {
          if (!queue.length) queue = shuffled();
          return 'clips/' + queue.pop().file;
        }

        function play(el) {
          var p = el.play();
          if (p && p.catch) p.catch(function () {
            // Autoplay was blocked; start on the first touch or click instead.
            window.addEventListener('pointerdown', function () { el.play(); }, { once: true });
          });
        }

        function advance() {
          current.classList.add('next');
          next.classList.remove('next');
          var t = current; current = next; next = t;
          play(current);
          next.src = pick();
          next.load();
          current.onended = advance;
        }

        fetch('clips/list.json')
          .then(function (r) { return r.json(); })
          .then(function (data) {
            list = data;
            current.src = pick();
            next.src = pick();
            next.load();
            current.onended = advance;
            play(current);
          })
          .catch(function () {});
      })();
      var w = window.innerWidth, h = window.innerHeight;
      var target = { x: w * 0.62, y: h * 0.38 };
      var a = { x: target.x, y: target.y };
      var b = { x: w * 0.3, y: h * 0.3 };
      var r = radius();
      var last = { x: target.x, y: target.y, t: 0 };
      var speed = 0;       // smoothed pointer speed, px/s
      var dwell = 0;       // seconds the pointer has been still
      var open = 1;        // current size multiplier of the pointer lens
      var trail = [];      // recent lens positions, newest first

      function radius() {
        // Mirrors --r: clamp(130px, 24vmin, 320px).
        var v = Math.min(Math.max(130, Math.min(w, h) * 0.24), 320);
        root.setProperty('--r', v + 'px');
        return v;
      }

      function point(e) {
        target.x = e.clientX;
        target.y = e.clientY;
      }

      window.addEventListener('pointermove', point, { passive: true });
      window.addEventListener('pointerdown', point, { passive: true });
      window.addEventListener('resize', function () {
        w = window.innerWidth;
        h = window.innerHeight;
        r = radius();
      });

      function tick(now) {
        var t = (now || 0) / 1000;
        var dt = Math.min(t - last.t, 0.1) || 0.016;
        last.t = t;

        // Pointer speed, smoothed so it doesn't flicker frame to frame.
        var mx = target.x - last.x, my = target.y - last.y;
        var inst = Math.sqrt(mx * mx + my * my) / dt;
        last.x = target.x; last.y = target.y;
        speed += (inst - speed) * 0.2;
        var rush = Math.min(speed / 1400, 1);

        // Dwell: hold still and the lens first tightens, then swells to fill the screen.
        // Any real movement snaps it shut.
        dwell = inst > 30 ? 0 : dwell + dt;
        var settle = Math.min(dwell / 0.6, 1);
        var goal;
        if (dwell < 0.6) {
          goal = 1 - 0.3 * settle;
        } else {
          var full = Math.max(w, h) * 0.8 / r;
          goal = Math.min(0.7 + (dwell - 0.6) / 7 * (full - 0.7), full);
        }
        goal += rush * 0.8;
        open += (goal - open) * (goal < open ? 0.22 : 0.06);

        a.x += (target.x - a.x) * 0.18;
        a.y += (target.y - a.y) * 0.18;
        // The second lens drifts toward the first and settles just short of overlapping it.
        var dx = a.x - b.x, dy = a.y - b.y;
        var dist = Math.sqrt(dx * dx + dy * dy) || 1;
        var pull = (dist - r * 0.9) / dist;
        b.x += dx * pull * 0.025;
        b.y += dy * pull * 0.025;

        root.setProperty('--ax', a.x + 'px');
        root.setProperty('--ay', a.y + 'px');
        root.setProperty('--bx', b.x + 'px');
        root.setProperty('--by', b.y + 'px');
        // Each lens slowly swells, shrinks and stretches on its own rhythm.
        var ra = r * open;
        root.setProperty('--arx', ra * (1 + 0.22 * Math.sin(t * 0.9)) + 'px');
        root.setProperty('--ary', ra * (1 + 0.22 * Math.sin(t * 1.3 + 1.7)) + 'px');
        root.setProperty('--brx', r * (1 + 0.22 * Math.sin(t * 0.7 + 3.1)) + 'px');
        root.setProperty('--bry', r * (1 + 0.22 * Math.sin(t * 1.1 + 0.6)) + 'px');
        // Speed blurs the edge of the pointer lens.
        root.setProperty('--asoft', (55 - 35 * rush) + '%');

        // Comet tail: small lenses strung along where the pointer just was, sized by speed.
        trail.unshift({ x: a.x, y: a.y });
        if (trail.length > 25) trail.pop();
        for (var i = 1; i <= 4; i++) {
          var p = trail[Math.min(i * 6, trail.length - 1)];
          root.setProperty('--t' + i + 'x', p.x + 'px');
          root.setProperty('--t' + i + 'y', p.y + 'px');
          root.setProperty('--t' + i + 'r', Math.max(r * 0.5 * rush * (1 - i * 0.18), 0.1) + 'px');
        }
        requestAnimationFrame(tick);
      }
      tick();
    })();
  </script>
</body>
</html>
