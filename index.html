<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Empathy Machine</title>
  <meta name="description" content="Empathy Machine. Contact: contact@empathymachine.online">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23ECEFF7'/%3E%3Ccircle cx='12' cy='16' r='9' fill='%23FF6B8A'/%3E%3Ccircle cx='20' cy='16' r='9' fill='%233D5AF1' style='mix-blend-mode:multiply'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --neon: #39FF14;
      --halo: 0 0 2px rgba(10, 20, 10, 0.9), 0 0 4px rgba(10, 20, 10, 0.5);
      --glow: var(--halo), 0 0 8px rgba(57, 255, 20, 0.85), 0 0 24px rgba(57, 255, 20, 0.5);
      --r: clamp(110px, 20vmin, 260px);
      --ax: 62vw; --ay: 38vh;
      --bx: 30vw; --by: 30vh;
    }

    * { box-sizing: border-box; margin: 0; }

    html, body { height: 100%; }

    body {
      background: #D9D3E3;
      color: var(--neon);
      font-family: "JetBrains Mono", ui-monospace, Menlo, monospace;
      text-transform: uppercase;
      overflow: hidden;
    }

    .field {
      position: fixed;
      inset: 0;
      overflow: hidden;
    }

    .layer {
      position: absolute;
      inset: 0;
      background: url(bg-1600.jpg) center / cover no-repeat;
    }

    @media (max-width: 700px) {
      .layer { background-image: url(bg-900.jpg); }
    }

    /* Two soft lenses cut through the paint to the video underneath. The gradients union by default. */
    .layer.reel {
      background: #000;
      object-fit: cover;
      width: 100%;
      height: 100%;
      -webkit-mask-image:
        radial-gradient(circle var(--r) at var(--ax) var(--ay), #000 72%, transparent 100%),
        radial-gradient(circle var(--r) at var(--bx) var(--by), #000 72%, transparent 100%);
      mask-image:
        radial-gradient(circle var(--r) at var(--ax) var(--ay), #000 72%, transparent 100%),
        radial-gradient(circle var(--r) at var(--bx) var(--by), #000 72%, transparent 100%);
    }

    main {
      position: relative;
      min-height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: clamp(24px, 5vw, 72px);
      pointer-events: none;
    }

    h1 {
      font-size: clamp(3.25rem, 12.5vw, 12rem);
      font-weight: 800;
      line-height: 0.95;
      letter-spacing: -0.04em;
      text-shadow: var(--glow);
    }

    p {
      margin-top: clamp(20px, 3vw, 40px);
      max-width: 34ch;
      font-size: clamp(1.1rem, 1.6vw, 1.5rem);
      font-weight: 400;
      line-height: 1.55;
      letter-spacing: 0.02em;
    }

    a {
      color: var(--neon);
      font-weight: 800;
      text-shadow: var(--glow);
      text-decoration-thickness: 0.08em;
      text-underline-offset: 0.18em;
      pointer-events: auto;
    }

    a:hover { color: #fff; }

    a:focus-visible {
      outline: 2px solid var(--neon);
      outline-offset: 4px;
      border-radius: 2px;
    }

    .credit {
      position: fixed;
      right: clamp(16px, 2vw, 28px);
      bottom: clamp(14px, 1.6vw, 22px);
      font-size: 0.68rem;
      letter-spacing: 0.06em;
      color: var(--neon);
      text-decoration: none;
      text-shadow: var(--halo);
      font-weight: 600;
    }

    .layer.reel.next { display: none; }

    @media (prefers-reduced-motion: reduce) {
      .layer.reel { display: none; }
    }
  </style>
</head>
<body>
  <div class="field" aria-hidden="true">
    <div class="layer photo"></div>
    <video class="layer reel" muted playsinline preload="auto"></video>
    <video class="layer reel next" muted playsinline preload="auto"></video>
  </div>

  <main>
    <h1>Empathy<br>Machine</h1>
    <p><a href="mailto:contact@empathymachine.online">contact@empathymachine.online</a></p>
  </main>

  <a class="credit" href="https://unsplash.com/photos/ruJm3dBXCqw" target="_blank" rel="noopener">Photo: Pawel Czerwinski</a>

  <script>
    (function () {
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

      var root = document.documentElement.style;

      // Dance clips play underneath the paint in a fresh shuffled order on every visit.
      (function reel() {
        var reels = document.querySelectorAll('.layer.reel');
        var current = reels[0], next = reels[1];
        var queue = [], list = [];

        function shuffled() {
          var a = list.slice();
          for (var i = a.length - 1; i > 0; i--) {
            var j = Math.floor(Math.random() * (i + 1));
            var t = a[i]; a[i] = a[j]; a[j] = t;
          }
          return a;
        }

        function pick() {
          if (!queue.length) queue = shuffled();
          return 'clips/' + queue.pop().file;
        }

        function play(el) {
          var p = el.play();
          if (p && p.catch) p.catch(function () {
            // Autoplay was blocked; start on the first touch or click instead.
            window.addEventListener('pointerdown', function () { el.play(); }, { once: true });
          });
        }

        function advance() {
          current.classList.add('next');
          next.classList.remove('next');
          var t = current; current = next; next = t;
          play(current);
          next.src = pick();
          next.load();
          current.onended = advance;
        }

        fetch('clips/list.json')
          .then(function (r) { return r.json(); })
          .then(function (data) {
            list = data;
            current.src = pick();
            next.src = pick();
            next.load();
            current.onended = advance;
            play(current);
          })
          .catch(function () {});
      })();
      var w = window.innerWidth, h = window.innerHeight;
      var target = { x: w * 0.62, y: h * 0.38 };
      var a = { x: target.x, y: target.y };
      var b = { x: w * 0.3, y: h * 0.3 };
      var r = radius();

      function radius() {
        // Mirrors --r: clamp(110px, 20vmin, 260px).
        var v = Math.min(Math.max(110, Math.min(w, h) * 0.2), 260);
        root.setProperty('--r', v + 'px');
        return v;
      }

      function point(e) {
        target.x = e.clientX;
        target.y = e.clientY;
      }

      window.addEventListener('pointermove', point, { passive: true });
      window.addEventListener('pointerdown', point, { passive: true });
      window.addEventListener('resize', function () {
        w = window.innerWidth;
        h = window.innerHeight;
        r = radius();
      });

      function tick() {
        a.x += (target.x - a.x) * 0.18;
        a.y += (target.y - a.y) * 0.18;
        // The second lens drifts toward the first and settles just short of overlapping it.
        var dx = a.x - b.x, dy = a.y - b.y;
        var dist = Math.sqrt(dx * dx + dy * dy) || 1;
        var pull = (dist - r * 0.9) / dist;
        b.x += dx * pull * 0.025;
        b.y += dy * pull * 0.025;

        root.setProperty('--ax', a.x + 'px');
        root.setProperty('--ay', a.y + 'px');
        root.setProperty('--bx', b.x + 'px');
        root.setProperty('--by', b.y + 'px');
        requestAnimationFrame(tick);
      }
      tick();
    })();
  </script>
</body>
</html>
